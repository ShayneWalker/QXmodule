# 2026-09-18 fixed: 修复"某些歌播几秒就跳下一首"
# 修复点:
#   1) bootstrap 也走 request-header 脚本, 删 If-None-Match, 避免 bootstrap 命中 304 缓存返回真实 free 账号状态
#   2) response-body 指向修复版 spotify-proto.fixed.js (脚本内全链路 try/catch + 嵌套判空 + financial-product 补全 rt)
#   3) 其余规则与原仓库保持一致
# 仓库地址 https://github.com/app2smile/rules
hostname = spclient.wg.spotify.com, *spclient.spotify.com

# 注意: 下面 script-response-body 的 URL 请替换成你自己托管 spotify-proto.fixed.js 的 raw 地址
# (GitHub Gist / 个人仓库 raw 链接均可), 不能直接指向本地文件
^https:\/\/(spclient\.wg\.spotify\.com|.*-spclient\.spotify\.com(:443)?)\/user-customization-service\/v1\/customize$ url script-request-header https://raw.githubusercontent.com/app2smile/rules/master/js/spotify-qx-header.js
^https:\/\/(spclient\.wg\.spotify\.com|.*-spclient\.spotify\.com(:443)?)\/bootstrap\/v1\/bootstrap$ url script-request-header https://raw.githubusercontent.com/app2smile/rules/master/js/spotify-qx-header.js
^https:\/\/(spclient\.wg\.spotify\.com|.*-spclient\.spotify\.com(:443)?)\/(bootstrap\/v1\/bootstrap|user-customization-service\/v1\/customize)$ url script-response-body https://https://raw.githubusercontent.com/ShayneWalker/QXmodule/refs/heads/main/Spotify%20AntiAds/spotify-proto.fixed.js?token=GHSAT0AAAAAAEJOQD5WSY6JWWNG36XHYCBW2VNLM4A
^https:\/\/(spclient\.wg\.spotify\.com|.*-spclient\.spotify\.com(:443)?)\/(artistview\/v1\/artist|album-entity-view\/v2\/album)\/ url script-request-header https://raw.githubusercontent.com/app2smile/rules/master/js/spotify-json.js
